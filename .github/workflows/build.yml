name: อัปเดตพยากรณ์และเผยแพร่เว็บ

on:
  schedule:
    - cron: "7 * * * *"        # ทุกชั่วโมง นาทีที่ 7 (เวลา UTC; GitHub อาจเลื่อนไปบ้างช่วงที่มีงานมาก)
  workflow_dispatch:            # กดรันเองได้จากแท็บ Actions
  push:
    branches: [main]

permissions:
  contents: write               # บันทึก realtime_log.csv กลับเข้า repo
  pages: write
  id-token: write

concurrency:
  group: plk-aircast-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # scikit-learn 1.6.1 เดียวกับตอนฝึก (ไฟล์โมเดลขึ้นกับเวอร์ชัน scikit-learn ไม่ใช่ Python)
          cache: pip
          cache-dependency-path: requirements-space.txt

      - name: ติดตั้งไลบรารี
        run: pip install -r requirements-space.txt

      - name: รันโมเดลและสร้างเว็บ
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
          CMUCCDC_API_KEY: ${{ secrets.CMUCCDC_API_KEY }}
        run: python build_static.py

      - name: บันทึกค่าเรียลไทม์ที่สะสม (realtime_log.csv)
        run: |
          git config user.name "plk-aircast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add realtime_log.csv realtime_sources.json
          if ! git diff --cached --quiet; then
            git commit -m "อัปเดตค่าเรียลไทม์ [skip ci]"
            git pull --rebase --autostash origin main && git push origin HEAD:main || echo "push ไม่สำเร็จ จะลองใหม่รอบหน้า"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
